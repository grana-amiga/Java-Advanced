server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  application:
    name: grana-amiga-api
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//oracle.fiap.com.br:1521/orcl}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true

info:
  app:
    name: Grana Amiga API
    version: 1.0.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

